repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        stages: [pre-push]
        exclude: |
          (?x)^(
              package/supabase-bundle\.js|
              package/background\.ts|
              package/supabase-client\.ts
          )$
