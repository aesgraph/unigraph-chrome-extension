<!DOCTYPE html>
<html>
  <head>
    <title>Save Webpage</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #fafbfc;
        border-radius: 10px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        border: 1px solid #e0e0e0;
        display: flex;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      .container {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      .panel-content {
        overflow-y: auto;
        padding: 18px 18px 0 18px;
      }
      .save-btn-container {
        flex-shrink: 0;
        padding: 12px 18px 12px 18px;
        background: #fafbfc;
        text-align: center;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.03);
      }
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #1976d2;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      .loading-text {
        color: #666;
        font-size: 14px;
        font-weight: 500;
      }
      .selected-text {
        background: #f5f5f5;
        padding: 7px;
        border-radius: 4px;
        margin-bottom: 8px;
        font-size: 13px;
        border: 1px solid #e0e0e0;
        max-height: 100px;
        overflow-y: auto;
        word-wrap: break-word;
      }
      .image-container {
        margin-bottom: 8px;
      }
      .annotation-image {
        max-width: 100%;
        max-height: 200px;
        border-radius: 4px;
        border: 1px solid #e0e0e0;
        object-fit: contain;
      }
      .form-group {
        margin-bottom: 16px;
      }
      label {
        font-weight: 500;
        font-size: 13px;
        margin-bottom: 2px;
        display: block;
        color: #333;
      }
      input[type="text"] {
        width: 100%;
        font-size: 13px;
        padding: 5px 7px;
        border-radius: 4px;
        border: 1px solid #d0d0d0;
        background: #fff;
        box-sizing: border-box;
      }
      input[readonly] {
        background: #f7f7f7;
        color: #666;
      }
      button {
        padding: 6px 20px;
        font-size: 14px;
        border-radius: 6px;
        border: none;
        background: #1976d2;
        color: #fff;
        cursor: pointer;
        margin: 0 auto;
        display: block;
        margin-top: 8px;
        margin-bottom: 4px;
        box-shadow: 0 1px 2px rgba(25, 118, 210, 0.08);
        transition: background 0.15s;
      }
      button:hover {
        background: #1565c0;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .info-message {
        color: #666;
        font-size: 12px;
        margin-bottom: 16px;
        font-style: italic;
      }
      .readonly-label {
        color: #666;
      }
      .divider {
        margin-top: 24px;
        margin-bottom: 16px;
        text-align: center;
        position: relative;
      }
      .divider-line {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        background: #e0e0e0;
      }
      .divider-text {
        background: #fafbfc;
        padding: 0 12px;
        color: #666;
        font-size: 12px;
        font-weight: 500;
        position: relative;
        z-index: 1;
      }
      textarea {
        width: 100%;
        min-height: 80px;
        max-height: 220px;
        margin-bottom: 8px;
        font-size: 13px;
        padding: 5px 7px;
        border-radius: 4px;
        border: 1px solid #d0d0d0;
        background: #fff;
        resize: vertical;
        box-sizing: border-box;
        overflow-y: auto;
      }
      .secondary-section {
        margin-top: 2px;
        margin-bottom: 6px;
      }
      .secondary-toggle {
        background: none;
        border: none;
        color: #1976d2;
        cursor: pointer;
        font-size: 12px;
        padding: 0;
        margin-bottom: 8px;
        text-decoration: underline;
      }
      .secondary-toggle:hover {
        color: #1565c0;
      }
      .secondary-comment-collapsed {
        display: none;
      }
      .secondary-comment-expanded {
        display: block;
      }
      .tags-input-container {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        background: #fff;
        min-height: 32px;
        align-items: center;
      }
      .tag-chip {
        background: #e3f2fd;
        color: #1976d2;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .tag-chip .remove-tag {
        cursor: pointer;
        font-weight: bold;
        color: #1976d2;
      }
      .tag-chip .remove-tag:hover {
        color: #1565c0;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel-content">
        <div id="loadingContainer" class="loading-container">
          <div class="spinner"></div>
          <div class="loading-text">
            Checking if webpage is already saved...
          </div>
        </div>
        <div id="contentContainer" style="display: none">
          <!-- Content will be dynamically populated -->
        </div>
      </div>
      <div class="save-btn-container">
        <button id="saveBtn" style="display: none">Save Webpage</button>
      </div>
    </div>
    <script src="supabase-bundle.js"></script>
    <script src="dist/supabase-client.js"></script>
    <script src="dist/save-webpage.js"></script>
  </body>
</html>
